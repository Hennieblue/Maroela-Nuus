<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maroela Nuus</title>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "90051a02-9265-4f58-8771-6d556de395ad"
      });

      const button = document.getElementById("subscribeButton");
      const status = document.getElementById("status");

      button.addEventListener("click", async function() {
        button.disabled = true;
        status.textContent = "Besig om intekening te aktiveer...";

        try {
          await OneSignal.User.PushSubscription.optIn();

          const subscribed = OneSignal.User.PushSubscription.optedIn;

          if (subscribed) {
            status.textContent = "Maroela Nuus-kennisgewings is geaktiveer.";
          } else {
            status.textContent =
              "Intekening is nog nie aktief nie. Kontroleer kennisgewingtoestemming.";
          }
        } catch (error) {
          status.textContent =
            "Intekening kon nie voltooi word nie. Probeer asseblief weer.";
          console.error("OneSignal intekeningfout:", error);
        } finally {
          button.disabled = false;
        }
      });
    });
  </script>
</head>
<body>
  <h1>Maroela Nuus</h1>
  <p>Afrikaanse nuuskennisgewings vir jou iPhone en rekenaar.</p>

  <button id="subscribeButton" type="button">
    Subscribe for notifications
  </button>

  <p id="status" aria-live="polite">
    Druk die knoppie om Maroela Nuus-kennisgewings te aktiveer.
  </p>

  <p>
    <a href="https://www.facebook.com/MaroelaMedia/">
      Maak Maroela Media op Facebook oop
    </a>
  </p>
</body>
</html>
