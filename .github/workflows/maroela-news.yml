name: Maroela Nuus Notifications

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maroela-news-notifications
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and send Maroela articles
        id: send_news
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path

          FEED_URL = "https://maroelamedia.co.za/feed/"
          STATE_FILE = Path("maroela_last_article.json")

          SUBSCRIPTION_IDS = [
              "de129f09-55e3-4b9f-a5f1-d1a1bd7dd752",
              "d8d7d459-d627-4f46-ba16-c285913d041a",
          ]

          APP_ID = os.environ.get("ONESIGNAL_APP_ID", "").strip()
          API_KEY = os.environ.get("ONESIGNAL_REST_API_KEY", "").strip()

          if not APP_ID or not API_KEY:
              raise SystemExit(
                  "Missing ONESIGNAL_APP_ID or ONESIGNAL_REST_API_KEY."
              )

          state = {}
          if STATE_FILE.exists():
              try:
                  state = json.loads(
                      STATE_FILE.read_text(encoding="utf-8")
                  )
              except (json.JSONDecodeError, OSError):
                  raise SystemExit(
                      "Could not read article state safely."
                  )

          previous_guid = state.get("guid", "")
          seen_guids = state.get("seen_guids", [])
          pending = state.get("pending", [])

          if not isinstance(seen_guids, list):
              seen_guids = []
          if not isinstance(pending, list):
              raise SystemExit("Pending article queue is invalid.")

          if previous_guid and previous_guid not in seen_guids:
              seen_guids.append(previous_guid)

          request = urllib.request.Request(
              FEED_URL,
              headers={
                  "User-Agent": "Maroela-Nuus-GitHub-Actions/1.0"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)
          channel = root.find("channel")
          items = channel.findall("item") if channel is not None else []

          def article_data(item):
              link = (item.findtext("link") or FEED_URL).strip()
              guid = (item.findtext("guid") or link).strip()
              return {
                  "guid": guid,
                  "title": (
                      item.findtext("title") or "Nuwe Maroela-nuus"
                  ).strip(),
                  "description": (
                      item.findtext("description") or ""
                  ).strip(),
                  "link": link,
              }

          articles = [article_data(item) for item in items]
          pending_guids = {
              article.get("guid", "") for article in pending
          }

          new_articles = []

          if not previous_guid:
              # First run: avoid sending the entire old RSS history.
              new_articles = articles[:1]
              print("No previous marker: starting with latest article.")

          else:
              previous_found = False

              for article in articles:
                  if article["guid"] == previous_guid:
                      previous_found = True
                      break

                  if (
                      article["guid"] not in seen_guids
                      and article["guid"] not in pending_guids
                  ):
                      new_articles.append(article)

              if not previous_found:
                  print(
                      "Previous marker is no longer in RSS. "
                      "Collecting currently available unseen articles."
                  )

          # RSS is newest first; queue oldest new article first.
          new_articles.reverse()

          for article in new_articles:
              pending.append(article)
              pending_guids.add(article["guid"])
              seen_guids.append(article["guid"])

          if articles:
              state["guid"] = articles[0]["guid"]
              state["title"] = articles[0]["title"]
              state["link"] = articles[0]["link"]

          # Save the queue before sending, so pending articles can be retried.
          state["pending"] = pending
          state["seen_guids"] = list(dict.fromkeys(seen_guids))[-500:]

          def save_state():
              STATE_FILE.write_text(
                  json.dumps(
                      state,
                      ensure_ascii=False,
                      indent=2
                  ) + "\n",
                  encoding="utf-8"
              )

          save_state()

          print(f"New articles queued: {len(new_articles)}")
          print(f"Articles waiting to send: {len(pending)}")

          while state["pending"]:
              article = state["pending"][0]

              title = article["title"]
              description = article["description"]
              link = article["link"]
              guid = article["guid"]

              print(f"Sending article: {title}")

              payload = {
                  "app_id": APP_ID,
                  "include_subscription_ids": SUBSCRIPTION_IDS,
                  "headings": {"en": "Maroela Nuus"},
                  "contents": {
                      "en": (
                          f"{title}\n\n{description}"
                          if description else title
                      )
                  },
                  "url": link,
              }

              api_request = urllib.request.Request(
                  "https://api.onesignal.com/notifications",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json; charset=utf-8",
                      "Authorization": f"Key {API_KEY}",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      api_request, timeout=30
                  ) as response:
                      response_body = response.read().decode(
                          "utf-8", errors="replace"
                      )
                      print("OneSignal HTTP status:", response.status)

              except urllib.error.HTTPError as error:
                  error_body = error.read().decode(
                      "utf-8", errors="replace"
                  )
                  print("OneSignal API error:", error.code, error_body)
                  raise SystemExit(
                      "Notification failed; article remains queued."
                  )

              print("OneSignal response:", response_body)

              try:
                  result = json.loads(response_body)
              except json.JSONDecodeError:
                  raise SystemExit(
                      "Invalid OneSignal response; article remains queued."
                  )

              if result.get("errors") or not result.get("id"):
                  raise SystemExit(
                      "OneSignal did not confirm notification creation; "
                      "article remains queued."
                  )

              print(f"Notification created successfully: {title}")

              # Remove only after OneSignal confirms creation.
              state["pending"] = [
                  queued for queued in state["pending"]
                  if queued.get("guid") != guid
              ]
              save_state()

          print("All queued article notifications processed.")
          PY


      - name: Save article queue and marker
        if: always() && steps.send_news.outcome != 'skipped'
        run: |
          git add maroela_last_article.json

          if git diff --cached --quiet -- maroela_last_article.json; then
            echo "No state change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git commit -m "Update Maroela article queue"
          git push
