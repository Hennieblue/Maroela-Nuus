name: Maroela Nuus Notifications

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maroela-news-notifications
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check RSS and send notifications
        id: send_news
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path

          FEED_URL = "https://maroelamedia.co.za/feed/"
          STATE_FILE = Path("maroela_last_article.json")
          SUBSCRIPTION_IDS = [
              "de129f09-55e3-4b9f-a5f1-d1a1bd7dd752",
              "d8d7d459-d627-4f46-ba16-c285913d041a",
          ]

          APP_ID = os.environ.get("ONESIGNAL_APP_ID", "").strip()
          API_KEY = os.environ.get("ONESIGNAL_REST_API_KEY", "").strip()

          if not APP_ID or not API_KEY:
              raise SystemExit(
                  "Missing GitHub Secrets: ONESIGNAL_APP_ID "
                  "and ONESIGNAL_REST_API_KEY."
              )

          request = urllib.request.Request(
              FEED_URL,
              headers={
                  "User-Agent": "Maroela-Nuus-GitHub-Actions/1.0"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)
          channel = root.find("channel")
          items = channel.findall("item") if channel is not None else []

          if not items:
              print("RSS feed contains no articles.")
              raise SystemExit(0)

          previous_guid = ""

          if STATE_FILE.exists():
              try:
                  previous_guid = json.loads(
                      STATE_FILE.read_text(encoding="utf-8")
                  ).get("guid", "")
              except (json.JSONDecodeError, OSError):
                  previous_guid = ""

          new_items = []

          if previous_guid:
              found_previous = False

              for item in items:
                  item_link = (
                      item.findtext("link") or FEED_URL
                  ).strip()
                  item_guid = (
                      item.findtext("guid") or item_link
                  ).strip()

                  if item_guid == previous_guid:
                      found_previous = True
                      break

                  new_items.append(item)

              if not found_previous:
                  print(
                      "Previous article is not in the RSS feed. "
                      "Stopping to avoid duplicate notifications."
                  )
                  raise SystemExit(0)

          else:
              new_items = items[:1]
              print(
                  "No previous marker. Processing only the latest article."
              )

          if not new_items:
              print("No new articles.")
              raise SystemExit(0)

          new_items.reverse()
          print(f"New articles found: {len(new_items)}")

          for item in new_items:
              title = (
                  item.findtext("title") or "Nuwe Maroela-nuus"
              ).strip()
              description = (
                  item.findtext("description") or ""
              ).strip()
              link = (
                  item.findtext("link") or FEED_URL
              ).strip()
              guid = (
                  item.findtext("guid") or link
              ).strip()

              print(f"Sending article: {title}")

              payload = {
                  "app_id": APP_ID,
                  "include_subscription_ids": SUBSCRIPTION_IDS,
                  "headings": {"en": "Maroela Nuus"},
                  "contents": {
                      "en": (
                          f"{title}\n\n{description}"
                          if description else title
                      )
                  },
                  "url": link,
              }

              body = json.dumps(payload).encode("utf-8")

              api_request = urllib.request.Request(
                  "https://api.onesignal.com/notifications",
                  data=body,
                  headers={
                      "Content-Type": "application/json; charset=utf-8",
                      "Authorization": f"Key {API_KEY}",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      api_request, timeout=30
                  ) as response:
                      response_body = response.read().decode(
                          "utf-8", errors="replace"
                      )
                      status_code = response.status

              except urllib.error.HTTPError as error:
                  error_body = error.read().decode(
                      "utf-8", errors="replace"
                  )
                  print(
                      "OneSignal API error:",
                      error.code,
                      error_body
                  )
                  raise SystemExit(
                      "OneSignal rejected the notification."
                  )

              print("OneSignal HTTP status:", status_code)
              print("OneSignal response:", response_body)

              try:
                  result = json.loads(response_body)
              except json.JSONDecodeError:
                  raise SystemExit(
                      "OneSignal returned invalid JSON."
                  )

              errors = result.get("errors")
              notification_id = result.get("id", "")

              if errors:
                  raise SystemExit(
                      "OneSignal notification errors: "
                      + json.dumps(errors, ensure_ascii=False)
                  )

              if not notification_id:
                  raise SystemExit(
                      "OneSignal did not confirm notification creation."
                  )

              STATE_FILE.write_text(
                  json.dumps(
                      {
                          "guid": guid,
                          "title": title,
                          "link": link
                      },
                      ensure_ascii=False,
                      indent=2
                  ) + "\n",
                  encoding="utf-8"
              )

              print(
                  f"Notification created successfully: "
                  f"{title} ({link})"
              )

          print("All new article notifications processed.")
          PY

      - name: Save latest article marker
        if: always() && steps.send_news.outcome != 'skipped'
        run: |
          if git diff --quiet -- maroela_last_article.json; then
            echo "No state change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add maroela_last_article.json
          git commit -m "Update last Maroela article marker"
          git push
